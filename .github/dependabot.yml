# One grouped pull request per ecosystem per week, instead of one per package.
# Major versions are skipped: they can break things and are better upgraded
# deliberately, with testing. Security fixes still arrive as their own PRs.
version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # pandas-ta pins numba==0.61.2, which needs numpy < 2.3. Any newer numpy
      # makes requirements.txt uninstallable; lift this when pandas-ta moves.
      - dependency-name: "numpy"
        versions: [">=2.3"]
      # passlib 1.7.4 is unmaintained; keep bcrypt where it is known to work.
      - dependency-name: "bcrypt"

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      frontend:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
